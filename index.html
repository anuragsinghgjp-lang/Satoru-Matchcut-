<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Satoru MatchCut</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="#">✦ SATORU MATCHCUT</a></header><main><section class="hero"><small>TEXT → MOTION</small><h1>Make your words<br><span>hit different.</span></h1><p>Create fast text match-cuts directly in your browser.</p><a href="#editor">START CREATING ↓</a></section><section id="editor" class="workspace"><div class="panel"><div class="head"><b>YOUR TEXT</b><button id="sample">Use sample</button></div><textarea id="text">ART
